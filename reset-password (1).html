<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir Senha — Veracity Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --navy:#080E1E; --dark:#0D1530; --cyan:#00D4FF; --white:#FFFFFF; --gray:#8896B3; --border:rgba(255,255,255,0.07); --green:#00E676; --red:#FF4D4D; }
  body { background: var(--navy); color: var(--white); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .box { background: var(--dark); border: 1px solid var(--border); padding: 48px; width: 400px; position: relative; }
  .box::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #1240AB, var(--cyan)); }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: 3px; margin-bottom: 4px; }
  .sub { font-size: 10px; letter-spacing: 4px; color: var(--red); font-weight: 700; margin-bottom: 32px; }
  .label { font-size: 10px; font-weight: 700; color: var(--gray); letter-spacing: 2px; display: block; margin-bottom: 8px; }
  .input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--white); padding: 12px 16px; font-size: 14px; font-family: 'DM Sans', sans-serif; outline: none; margin-bottom: 16px; }
  .input:focus { border-color: var(--cyan); }
  .btn { width: 100%; background: var(--cyan); color: var(--navy); font-size: 13px; font-weight: 700; letter-spacing: 2px; padding: 14px; border: none; cursor: pointer; margin-top: 8px; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { font-size: 13px; text-align: center; margin-top: 16px; padding: 10px; display: none; }
  .msg.success { color: var(--green); background: rgba(0,230,118,0.08); border: 1px solid rgba(0,230,118,0.2); }
  .msg.error { color: var(--red); background: rgba(255,77,77,0.08); border: 1px solid rgba(255,77,77,0.2); }
  .loading { text-align: center; padding: 20px; color: var(--gray); font-size: 13px; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">VERACITY</div>
  <div class="sub">REDEFINIR SENHA</div>
  <div id="conteudo">
    <div class="loading">Verificando...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL = 'https://nfusabwpxpdcqedrehrc.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mdXNhYndweHBkY3FlZHJlaHJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4MTEyOTUsImV4cCI6MjA5MjM4NzI5NX0.sUmFeXhXsx7D7BKPrKrXFHSVuqhFdIKgOCdfUQumECY';

var db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function mostrarFormulario() {
  document.getElementById('conteudo').innerHTML = `
    <label class="label">NOVA SENHA</label>
    <input type="password" id="novaSenha" class="input" placeholder="Mínimo 8 caracteres">
    <label class="label">CONFIRMAR SENHA</label>
    <input type="password" id="confirmarSenha" class="input" placeholder="Digite a senha novamente">
    <button class="btn" id="btnSalvar" onclick="redefinirSenha()">SALVAR NOVA SENHA</button>
    <div id="msg" class="msg"></div>
  `;
}

function mostrarErro(texto) {
  document.getElementById('conteudo').innerHTML = `
    <div style="color:var(--red);text-align:center;font-size:13px;line-height:1.6;">
      ${texto}<br><br>
      <a href="/login.html" style="color:var(--cyan);">Voltar para o login</a>
    </div>
  `;
}

async function redefinirSenha() {
  var nova = document.getElementById('novaSenha').value;
  var confirmar = document.getElementById('confirmarSenha').value;
  var msg = document.getElementById('msg');
  var btn = document.getElementById('btnSalvar');

  if (!nova || nova.length < 8) {
    msg.className = 'msg error'; msg.style.display = 'block';
    msg.textContent = 'A senha deve ter no mínimo 8 caracteres.'; return;
  }
  if (nova !== confirmar) {
    msg.className = 'msg error'; msg.style.display = 'block';
    msg.textContent = 'As senhas não coincidem.'; return;
  }

  btn.disabled = true;
  btn.textContent = 'Salvando...';

  var { error } = await db.auth.updateUser({ password: nova });

  if (error) {
    msg.className = 'msg error'; msg.style.display = 'block';
    msg.textContent = 'Erro: ' + error.message;
    btn.disabled = false; btn.textContent = 'SALVAR NOVA SENHA';
    return;
  }

  msg.className = 'msg success'; msg.style.display = 'block';
  msg.textContent = 'Senha redefinida com sucesso! Redirecionando...';
  setTimeout(function() { window.location.href = '/login.html'; }, 2000);
}

// Inicializa — o Supabase cuida da sessão automaticamente via URL hash
async function init() {
  // Aguarda o Supabase processar o hash da URL
  var { data, error } = await db.auth.getSession();

  if (data && data.session) {
    mostrarFormulario();
    return;
  }

  // Tenta recuperar sessão do hash da URL manualmente
  var hash = window.location.hash.substring(1);
  if (hash) {
    var params = new URLSearchParams(hash);
    var accessToken = params.get('access_token');
    var refreshToken = params.get('refresh_token');
    var type = params.get('type');

    if (accessToken && type === 'recovery') {
      var { data: sessionData, error: sessionError } = await db.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken || ''
      });

      if (sessionData && sessionData.session) {
        mostrarFormulario();
        return;
      }
    }
  }

  // Aguarda evento de auth (Supabase v2 processa hash automaticamente)
  db.auth.onAuthStateChange(function(event, session) {
    if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
      mostrarFormulario();
    }
  });

  // Timeout de 3 segundos
  setTimeout(function() {
    db.auth.getSession().then(function(result) {
      if (result.data && result.data.session) {
        mostrarFormulario();
      } else {
        mostrarErro('Link inválido ou expirado.<br>Solicite um novo link de recuperação.');
      }
    });
  }, 3000);
}

init();
</script>
</body>
</html>
